<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Etiketas</title>
<link rel="icon" type="image/png" href="/Nando-ico.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Roboto:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script>Babel.registerPreset('app',{presets:[[Babel.availablePresets['react'],{runtime:'classic'}],Babel.availablePresets['env']]});</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* 60% -- dominant neutrals (backgrounds/surfaces) */
  --bg:#DFECE2;--surface:#FFFFFF;--surface2:#F5F9F6;--surface3:#CFE3D3;
  --border:#C9DFCD;--border2:#B9D6BE;
  /* 30% -- text / structure */
  --text:#262B48;--text2:#63667B;--text3:#7D8091;
  --on-accent:#FFFFFF;
  /* 10% -- brand accent */
  --accent:#2F8E52;--accent2:#2C6B4E;--accent-dim:rgba(47,142,82,.13);
  --accent-rgb:47,142,82;
  --success:#2F8E52;
  /* Nando brand sage -- secondary accent per brand guide: supporting UI,
     secondary tags, illustration fills. Kept distinct from --accent (green)
     so "do" (green) and "shown/context" (sage) stay visually separate. */
  --sage:#7CB182;--sage-rgb:124,177,130;
  /* supporting accents -- used sparingly for status/category, not structure */
  --danger:#CB4A64;--danger-rgb:203,74,100;
  --warning:#BA7F1E;--warning-rgb:186,127,30;
  --mo:#2A3378;--mo-rgb:42,51,120;
  --pam:#8A5F49;--pam-rgb:138,95,73;
  --ce:#2F8E52;
  --indd:#AC3A87;--indd-rgb:172,58,135;
  --idml:#397BC2;--idml-rgb:57,123,194;
  --wip:#12847E;--wip-rgb:18,132,126;
  --shadow-sm:rgba(38,43,72,.10);--shadow-md:rgba(38,43,72,.16);--shadow-lg:rgba(38,43,72,.22);
  /* Brand shape language: soft, generous "capsule" rounding -- avoid sharp
     corners; pill-shape for single-line controls (buttons/tags/chips). */
  --radius:14px;--radius-sm:8px;--radius-pill:999px;
}
html,body,#root{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Roboto',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:224px;min-width:224px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
.sidebar-logo{padding:20px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.sidebar-logo-img{height:28px;width:auto;opacity:.92;flex-shrink:0;filter:invert(1) brightness(.15)}
.sidebar-logo-text{font-family:'Open Sans',sans-serif;font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.01em}
.sidebar-logo-sub{font-size:10px;color:var(--text3);margin-top:2px;font-family:'DM Mono',monospace;letter-spacing:.04em;text-transform:uppercase}
.sidebar-nav{flex:1;padding:10px}.sidebar-footer{padding:14px 10px;border-top:1px solid var(--border)}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:background .15s,color .15s;color:var(--text2);font-size:13px;font-weight:500;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--surface2);color:var(--text)}.nav-item.active{background:var(--accent-dim);color:var(--accent)}
.nav-item .icon{width:16px;height:16px;opacity:.7;flex-shrink:0}.nav-item.active .icon{opacity:1}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.topbar{height:52px;position:relative;display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0;background:var(--surface)}
.topbar::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--sage) 0 25%,var(--accent) 25% 50%,var(--mo) 50% 75%,var(--text) 75% 100%)}
.topbar-title{font-family:'Open Sans',sans-serif;font-size:16px;font-weight:700;color:var(--text)}
.content{flex:1;overflow-y:auto;padding:28px;background:var(--bg)}.content.no-scroll{overflow:hidden}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 18px;border-radius:var(--radius-pill);border:none;cursor:pointer;font-size:13px;font-family:'Roboto',sans-serif;font-weight:500;transition:all .15s}
.btn-primary{background:var(--accent);color:var(--on-accent)}.btn-primary:hover{background:var(--accent2)}.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--text);border:1.5px solid var(--text)}.btn-ghost:hover{background:var(--text);color:var(--on-accent)}
.btn-folder{background:rgba(var(--pam-rgb),.1);color:var(--pam);border:1px solid rgba(var(--pam-rgb),.25)}.btn-folder:hover{background:rgba(var(--pam-rgb),.2);color:var(--pam)}
.btn-indesign:hover{color:var(--indd) !important;border-color:rgba(var(--indd-rgb),.35) !important}
.btn-danger{background:rgba(var(--danger-rgb),.12);color:var(--danger);border:1px solid rgba(var(--danger-rgb),.25)}.btn-danger:hover{background:rgba(var(--danger-rgb),.22)}
.btn-sm{padding:5px 11px;font-size:12px}.btn-lg{padding:11px 22px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:12px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.06em}
.input{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:8px 12px;color:var(--text);font-size:13px;font-family:'Roboto',sans-serif;outline:none;width:100%;transition:border-color .15s}
.input:focus{border-color:var(--accent)}.input::placeholder{color:var(--text3)}
.search-wrap{position:relative}.search-wrap input{padding-left:34px}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
.stat-value{font-family:'Open Sans',sans-serif;font-size:28px;font-weight:700;line-height:1}
.stat-label{font-size:12px;color:var(--text2);margin-top:6px}.stat-accent{color:var(--accent)}
.section-title{font-family:'Open Sans',sans-serif;font-size:12px;font-weight:700;color:var(--sage);text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px}
.files-table{width:100%;border-collapse:collapse}
.files-table th{text-align:left;font-size:11px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;border-bottom:1px solid var(--border)}
.files-table td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
.files-table tr:last-child td{border-bottom:none}.files-table tr:hover td{background:var(--surface2)}
.path-cell{font-family:'DM Mono',monospace;font-size:11px;color:var(--text2);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-actions{display:flex;gap:6px;opacity:0}tr:hover .file-actions{opacity:1}
.wizard{max-width:680px}.wizard-steps{display:flex;align-items:center;gap:0;margin-bottom:36px}
.step-circle{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;font-family:'Open Sans',sans-serif;flex-shrink:0;transition:all .2s}
.step-circle.done{background:var(--accent);color:var(--on-accent)}.step-circle.active{background:var(--surface3);color:var(--text);border:2px solid var(--accent)}.step-circle.future{background:var(--surface2);color:var(--text3);border:2px solid var(--border2)}
.step-line{flex:1;height:2px;background:var(--border2)}.step-line.done{background:var(--accent)}
.step-wrap{display:flex;flex-direction:column;align-items:center}.step-label{font-size:11px;color:var(--text3);margin-top:6px;white-space:nowrap}
.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-height:380px;overflow-y:auto;padding-right:4px}
.product-card{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:12px 14px;cursor:pointer;transition:all .15s;text-align:left}
.product-card:hover{background:var(--surface3)}.product-card.selected{border-color:var(--accent);background:var(--accent-dim)}
.product-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:4px}
.lang-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:300px;overflow-y:auto}
.lang-card{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:10px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:8px}
.lang-card:hover{background:var(--surface3)}.lang-card.selected{border-color:var(--accent);background:var(--accent-dim)}.lang-card.disabled{opacity:.35;cursor:not-allowed}
.lang-flag{font-size:18px;line-height:1}.lang-code{font-size:12px;font-family:'DM Mono',monospace;font-weight:500;color:var(--text)}.lang-name{font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.size-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.size-card{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:16px;cursor:pointer;transition:all .15s;text-align:center}
.size-card:hover{background:var(--surface3)}.size-card.selected{border-color:var(--accent);background:var(--accent-dim)}
.size-label{font-size:18px;font-family:'Open Sans',sans-serif;font-weight:700;color:var(--text)}.size-dims{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:4px}
.template-match{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.match-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.match-title{font-size:12px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.06em}
.match-score{font-size:11px;font-family:'DM Mono',monospace;padding:2px 8px;border-radius:20px}
.score-high{background:rgba(var(--accent-rgb),.15);color:var(--success)}.score-med{background:rgba(var(--warning-rgb),.15);color:var(--warning)}.score-low{background:rgba(var(--danger-rgb),.15);color:var(--danger)}
.match-file{font-family:'DM Mono',monospace;font-size:12px;color:var(--text2);word-break:break-all}
.new-name{font-family:'DM Mono',monospace;font-size:12px;color:var(--accent);word-break:break-all}
.no-template{color:var(--text3);font-size:12px;font-style:italic}
.review-row{display:flex;gap:14px;margin-bottom:12px}
.review-label{font-size:12px;color:var(--text3);width:120px;flex-shrink:0;padding-top:1px}.review-value{font-size:13px;color:var(--text);flex:1}
.result-success{text-align:center;padding:32px}.result-icon{font-size:48px;margin-bottom:16px}
.result-title{font-family:'Open Sans',sans-serif;font-size:20px;font-weight:700;margin-bottom:8px}
.result-files{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:14px;margin:18px 0;text-align:left}
.result-file{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}.result-file:last-child{border-bottom:none}
.result-file-name{font-family:'DM Mono',monospace;font-size:11px;color:var(--accent);margin-bottom:2px}.result-file-info{font-size:11px;color:var(--text3)}
.browser-filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.filter-chip{padding:5px 12px;border-radius:20px;border:1px solid var(--border2);background:var(--surface2);cursor:pointer;font-size:12px;color:var(--text2);transition:all .15s}
.filter-chip:hover{border-color:var(--accent);color:var(--accent)}.filter-chip.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
@keyframes chipRowIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}.lang-chips-row{animation:chipRowIn .18s ease}
.filter-chip.active-box{background:rgba(var(--pam-rgb),.15);border-color:var(--pam);color:var(--pam)}.filter-chip.active-label{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}.filter-chip.active-indesign{background:rgba(var(--indd-rgb),.15);border-color:var(--indd);color:var(--indd)}.filter-chip.active-print{background:var(--surface3);border-color:var(--text2);color:var(--text)}.filter-chip.active-wip{background:rgba(var(--wip-rgb),.15);border-color:var(--wip);color:var(--wip)}.filter-chip.active-lang{background:rgba(var(--mo-rgb),.15);border-color:var(--mo);color:var(--mo)}.filter-chip.active-pam{background:rgba(var(--pam-rgb),.15);border-color:var(--pam);color:var(--pam)}.filter-chip.active-mo{background:rgba(var(--mo-rgb),.15);border-color:var(--mo);color:var(--mo)}.filter-chip.active-ce{background:var(--accent-dim);border-color:var(--ce);color:var(--ce)}
.settings-tabs{display:flex;gap:2px;margin-bottom:24px;background:var(--surface2);border-radius:var(--radius-sm);padding:3px;border:1px solid var(--border);width:fit-content}
.settings-tab{padding:7px 18px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);border:none;background:none;transition:all .15s}
.settings-tab.active{background:var(--surface3);color:var(--text)}
.product-list-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);margin-bottom:8px}
.pill-toggle{display:flex;gap:2px;background:var(--surface2);border-radius:4px;padding:2px}
.pill-btn{padding:3px 10px;border-radius:3px;border:none;cursor:pointer;font-size:11px;font-family:'DM Mono',monospace;font-weight:500;transition:all .15s}
.pill-btn.active-pam{background:var(--pam);color:var(--on-accent)}.pill-btn.active-mo{background:var(--mo);color:var(--on-accent)}.pill-btn.active-ce{background:var(--ce);color:var(--on-accent)}.pill-btn.inactive{background:transparent;color:var(--text3)}
.toggle{position:relative;width:34px;height:20px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--surface3);border-radius:10px;cursor:pointer;transition:.2s}
.toggle-slider::before{content:'';position:absolute;width:14px;height:14px;left:3px;bottom:3px;background:var(--text3);border-radius:50%;transition:.2s}
.toggle input:checked + .toggle-slider{background:var(--accent)}.toggle input:checked + .toggle-slider::before{transform:translateX(14px);background:var(--on-accent)}
.acidic-badge{font-size:10px;padding:2px 7px;border-radius:3px;background:rgba(var(--pam-rgb),.15);color:var(--pam);font-family:'DM Mono',monospace}
.topbar-badge{font-size:11px;padding:2px 8px;border-radius:20px;font-family:'DM Mono',monospace;font-weight:500}
.badge-pam{background:rgba(var(--pam-rgb),.15);color:var(--pam)}.badge-mo{background:rgba(var(--mo-rgb),.15);color:var(--mo)}.badge-wip{background:rgba(var(--warning-rgb),.15);color:var(--warning)}.badge-ok{background:rgba(var(--accent-rgb),.15);color:var(--success)}
.alert{padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;display:flex;align-items:flex-start;gap:8px}
.alert-info{background:var(--surface2);border:1px solid var(--border2);color:var(--text2)}.alert-error{background:rgba(var(--danger-rgb),.08);border:1px solid rgba(var(--danger-rgb),.25);color:var(--danger)}
.spinner{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ── View / tab switch animation ── */
@keyframes viewIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.view-anim{animation:viewIn .18s cubic-bezier(.4,0,.2,1) both}
/* ── Information section animations ── */
@keyframes gradientReveal{from{clip-path:inset(0 100% 0 0 round var(--radius-sm))}to{clip-path:inset(0 0 0 0 round var(--radius-sm))}}
@keyframes shimmerSweep{0%{transform:translateX(-100%) skewX(-12deg)}100%{transform:translateX(350%) skewX(-12deg)}}
@keyframes swatchIn{from{opacity:0;transform:scaleX(0);transform-origin:left}to{opacity:1;transform:scaleX(1)}}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes zzDraw{to{stroke-dashoffset:0}}
@keyframes zzJointIn{to{opacity:1;transform:scale(1)}}
.info-gradient-bar{animation:gradientReveal .55s cubic-bezier(.4,0,.2,1) both}
.info-bar-shimmer{position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.18) 50%,transparent 65%);animation:shimmerSweep .9s ease .55s 1;pointer-events:none}
.info-swatch{animation:swatchIn .32s cubic-bezier(.4,0,.2,1) both}
.info-card{animation:fadeSlideUp .35s cubic-bezier(.4,0,.2,1) both}
.zz-stick{stroke-dashoffset:1;animation:zzDraw .3s cubic-bezier(.4,0,.2,1) both}
.zz-joint{opacity:0;transform:scale(0);transform-box:fill-box;transform-origin:center;animation:zzJointIn .22s cubic-bezier(.4,0,.2,1) both}
/* ── General polish ── */
.card{transition:box-shadow .2s,border-color .2s}.card:hover{box-shadow:0 4px 24px var(--shadow-sm);border-color:var(--border2)}
.nav-item.active{border-left:2px solid var(--accent);padding-left:8px}
.btn-primary{box-shadow:0 2px 12px rgba(var(--accent-rgb),.2)}.btn-primary:hover{box-shadow:0 4px 20px rgba(var(--accent-rgb),.35);transform:translateY(-1px)}.btn-primary:active{transform:translateY(0)}
.stat-card{transition:box-shadow .2s,transform .2s}.stat-card:hover{box-shadow:0 6px 28px var(--shadow-md);transform:translateY(-2px)}
.input:focus{box-shadow:0 0 0 3px rgba(var(--accent-rgb),.15)}
.files-table tr{transition:background .12s}.files-table tr:hover td{background:var(--surface2)}.files-table tr:hover td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
.filter-chip{transition:all .15s}.filter-chip:hover{transform:translateY(-1px)}.filter-chip:active{transform:translateY(0)}
.product-card{transition:all .18s}.product-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px var(--shadow-sm)}
.lang-card{transition:all .15s}.lang-card:hover{transform:translateY(-1px)}
.size-card{transition:all .18s}.size-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px var(--shadow-sm)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-state .icon{font-size:40px;margin-bottom:12px;opacity:.5}.empty-state p{font-size:14px;margin-bottom:6px;color:var(--text2)}
.divider{height:1px;background:var(--border);margin:20px 0}
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}
.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}
.ml-auto{margin-left:auto}.w-full{width:100%}
.text-accent{color:var(--accent)}.text-muted{color:var(--text3)}.font-mono{font-family:'DM Mono',monospace}.text-sm{font-size:12px}.text-xs{font-size:11px}.font-bold{font-weight:700}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="app" src="/static/app.js"></script>
</body>
</html>
